name: Release extension zip

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Build extension zip
        run: |
          mkdir -p dist
          ZIP_NAME="apstra-extension-main-latest.zip"

          zip -r "dist/${ZIP_NAME}" \
            manifest.json \
            popup \
            src \
            README.md

          echo "zip_name=${ZIP_NAME}" >> "$GITHUB_OUTPUT"
        id: package

      - name: Upload ZIP as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: extension-zip
          path: dist/${{ steps.package.outputs.zip_name }}
          if-no-files-found: error

      - name: Create or update rolling release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: main-latest
          TITLE: Main Latest Build
          ZIP_PATH: dist/${{ steps.package.outputs.zip_name }}
        run: |
          NOTES_FILE="$(mktemp)"
          cat > "$NOTES_FILE" <<EOF
          Automatic build from main.

          Commit: ${GITHUB_SHA}
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            CURRENT_ZIP_NAME="$(basename "$ZIP_PATH")"
            gh release view "$TAG" --json assets --jq '.assets[].name' \
              | grep -E '^apstra-extension-.*\.zip$' \
              | while read -r ASSET_NAME; do
                  if [ "$ASSET_NAME" != "$CURRENT_ZIP_NAME" ]; then
                    gh release delete-asset "$TAG" "$ASSET_NAME" --yes
                  fi
                done || true

            gh release upload "$TAG" "$ZIP_PATH" --clobber
            gh release edit "$TAG" \
              --title "$TITLE" \
              --notes-file "$NOTES_FILE" \
              --prerelease \
              --latest=false \
              --target "$GITHUB_SHA"
          else
            gh release create "$TAG" "$ZIP_PATH" \
              --title "$TITLE" \
              --notes-file "$NOTES_FILE" \
              --prerelease \
              --latest=false \
              --target "$GITHUB_SHA"
          fi

          echo "Release URL:"
          gh release view "$TAG" --json url --jq .url