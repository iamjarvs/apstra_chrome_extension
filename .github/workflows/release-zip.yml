name: Release extension zip

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build extension zip
        run: |
          mkdir -p dist
          ZIP_NAME="apstra-extension-main-latest.zip"

          zip -r "dist/${ZIP_NAME}" \
            manifest.json \
            popup \
            src \
            README.md

          echo "zip_name=${ZIP_NAME}" >> "$GITHUB_OUTPUT"
        id: package

      - name: Create or update rolling release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: main-latest
          TITLE: Main Latest Build
          ZIP_PATH: dist/${{ steps.package.outputs.zip_name }}
        run: |
          NOTES_FILE="$(mktemp)"
          cat > "$NOTES_FILE" <<EOF
          Automatic build from main.

          Commit: ${GITHUB_SHA}
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP_PATH" --clobber
            gh release edit "$TAG" \
              --title "$TITLE" \
              --notes-file "$NOTES_FILE" \
              --prerelease \
              --latest=false \
              --target "$GITHUB_SHA"
          else
            gh release create "$TAG" "$ZIP_PATH" \
              --title "$TITLE" \
              --notes-file "$NOTES_FILE" \
              --prerelease \
              --latest=false \
              --target "$GITHUB_SHA"
          fi