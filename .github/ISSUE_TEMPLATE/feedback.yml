name: Feedback
description: Share feedback about Data Center Director Tools.
title: "[Feedback]: "
labels:
  - feedback
body:
  - type: markdown
    attributes:
      value: Thank you for sharing your feedback.
  - type: textarea
    id: feedback
    attributes:
      label: Your feedback
      placeholder: Tell us what is working well or what could be improved.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Include examples, screenshots, or relevant workflow details.